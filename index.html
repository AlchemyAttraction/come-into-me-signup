<style>
  :root {
    --cream: #ebe5b0;
    --cream-soft: rgba(235, 229, 176, 0.82);
    --cream-line: rgba(235, 229, 176, 0.55);
    --black: #000;
    --title-w: min(88vw, 780px);
    --col: min(92vw, 560px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--black); }

  body {
    min-height: 100vh; min-height: 100svh;
    background: var(--black);
    color: var(--cream);
    font-family: "Cormorant Garamond", Georgia, serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(20px, 4vh, 48px) 20px;
  }

  main { width: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; }

  .kicker {
    font-family: "Montserrat", sans-serif;
    font-weight: 400;
    font-size: 12px;
    letter-spacing: 0.34em;
    text-indent: 0.34em;
    text-transform: uppercase;
    color: var(--cream);
    margin-bottom: clamp(12px, 2.4vh, 22px);
  }

  /* ---- Signature title: tall, extra-condensed Didone, ALL CAPS, one line ---- */
  .sig-title { width: var(--title-w); }
  .sig-title h1 { font-weight: inherit; }
  .sig-title .w {
    --fs: calc(min(88vw, 780px) / 5.75);
    position: relative;
    display: block;
    width: 100%;
    height: calc(var(--fs) * 0.8925);
    font-family: "Noto Serif Display", serif;
    font-weight: 300;
    font-stretch: 62.5%;
    font-size: var(--fs);
    line-height: 0.72;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--cream);
    text-shadow: none;
  }
  .sig-title .w > i {
    position: absolute;
    left: 50%;
    top: calc(var(--fs) * 0.045);
    display: inline-block;
    font-style: normal;
    transform: translateX(-50%) scaleY(1.25);
    transform-origin: 50% 0;
  }

  @keyframes sharpen {
    from { opacity: 0; filter: blur(14px); transform: translateY(14px); }
    to   { opacity: 1; filter: blur(0);    transform: none; }
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .sig-title .w { animation: sharpen 1.5s cubic-bezier(.39,.575,.565,1) both; }
  .lower { animation: rise 1.2s ease-out 0.9s both; }

  /* ---- Everything below the title, on one even rhythm ---- */
  .lower {
    width: var(--col);
    margin-top: clamp(30px, 5.5vh, 52px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(18px, 3vh, 28px);
  }

  .ask {
    font-size: clamp(24px, 5.2vw, 32px);
    line-height: 1.3;
    color: var(--cream);
    text-wrap: balance;
  }

  /* ---- Form: a proper box + button ---- */
  form { width: 100%; display: flex; flex-wrap: wrap; gap: 10px; }
  .field { flex: 1 1 260px; }
  .field label {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }
  .field input {
    width: 100%;
    height: 58px;
    background: rgba(235, 229, 176, 0.07);
    border: 1px solid var(--cream-line);
    border-radius: 2px;
    color: var(--cream);
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 500;
    font-size: 22px;
    padding: 0 18px;
    text-align: left;
    outline: none;
    transition: border-color .2s, background .2s, box-shadow .2s;
  }
  .field input::placeholder { color: rgba(235, 229, 176, 0.7); font-style: italic; font-weight: 400; }
  .field input:focus {
    border-color: var(--cream);
    background: rgba(235, 229, 176, 0.11);
    box-shadow: 0 0 0 3px rgba(235, 229, 176, 0.18);
  }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

  button {
    flex: 0 0 auto;
    height: 58px;
    background: var(--cream);
    color: var(--black);
    border: 1px solid var(--cream);
    border-radius: 2px;
    padding: 0 28px;
    font-family: "Montserrat", sans-serif;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 0.28em;
    text-indent: 0.28em;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity .2s, transform .2s;
  }
  button:hover { opacity: .9; }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--cream); outline-offset: 3px; }
  button[disabled] { opacity: .55; cursor: default; }

  .status { width: 100%; min-height: 1.3em; font-size: 19px; color: var(--cream-soft); }
  .status.err { color: #f0c2b3; }
  .status:empty { display: none; }

  .fine {
    font-family: "Montserrat", sans-serif;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-indent: 0.2em;
    text-transform: uppercase;
    color: var(--cream);
    line-height: 1.8;
  }

  /* ---- Success state ---- */
  .done { display: none; flex-direction: column; align-items: center; gap: 10px; }
  .done .big { font-size: clamp(28px, 6.4vw, 36px); line-height: 1.2; }
  .done .small { font-size: 22px; color: var(--cream-soft); }
  body.is-done form, body.is-done .ask { display: none; }
  body.is-done .done { display: flex; }

  @media (max-width: 520px) {
    form { flex-direction: column; }
    .field { flex-basis: auto; }
    button { width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .sig-title .w, .lower { animation: none !important; }
  }
</style>
</head>
<body>
  <main>
    <p class="kicker">A Memoir</p>

    <div class="sig-title" role="img" aria-label="Come Into Me">
      <h1 aria-hidden="true"><span class="w"><i>Come Into Me</i></span></h1>
    </div>

    <div class="lower">
      <p class="ask">Drop your email. I'll notify you when it's available — in print and digital.</p>

      <form id="signup" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="Your email address" autocomplete="email" inputmode="email" required maxlength="254" />
        </div>
        <div class="hp" aria-hidden="true">
          <label for="company">Company</label>
          <input id="company" name="company" type="text" tabindex="-1" autocomplete="off" />
        </div>
        <button type="submit" id="submit">Notify me</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>

      <section class="done" aria-live="polite">
        <p class="big">You're on the list.</p>
        <p class="small">I'll find you when it's time.</p>
      </section>

      <p class="fine">Robyn Linn &nbsp;·&nbsp; No noise. Unsubscribe anytime.</p>
    </div>
  </main>

<script>
  (function () {
    // Fit COME INTO ME to the full width of its box, whatever the font metrics.
    function fit() {
      var box = document.querySelector(".sig-title .w");
      if (!box) return;
      var span = box.firstElementChild;
      var W = box.clientWidth;
      box.style.setProperty("--fs", "100px");
      var tw = span.getBoundingClientRect().width;
      if (tw > 0 && W > 0) box.style.setProperty("--fs", (100 * W / tw) + "px");
    }
    fit();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
    window.addEventListener("resize", fit);

    var form = document.getElementById("signup");
    var btn = document.getElementById("submit");
    var statusEl = document.getElementById("status");
    var emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
    function setStatus(msg, isErr) { statusEl.textContent = msg || ""; statusEl.className = "status" + (isErr ? " err" : ""); }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var email = form.email.value.trim();
      if (!emailRe.test(email)) { setStatus("That email doesn't look right.", true); form.email.focus(); return; }
      btn.disabled = true; setStatus("");
      fetch("/api/subscribe", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email, company: form.company.value })
      })
        .then(function (r) { return r.json().catch(function () { return {}; }); })
        .then(function (data) {
          if (data && data.ok) { document.body.classList.add("is-done"); }
          else { btn.disabled = false; setStatus(((data && data.error) || "Something snagged. Try again in a moment.") + (data && data.detail ? " (" + data.detail + ")" : ""), true); }
        })
        .catch(function () { btn.disabled = false; setStatus("Something snagged. Try again in a moment.", true); });
    });
  })();
</script>
</body>
</html>
